name: "🐛 Bug Report"
description: Report a Stardust bug — something that's broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Stardust bug. Please fill out the sections below so the failure can be reproduced and fixed quickly.

        **Before submitting**, please:
        - [ ] Search [existing Stardust issues](https://github.com/9529360-cpu/stardust-hermes/issues) to avoid duplicates
        - [ ] Run `hermes doctor` and include any relevant failures below
        - [ ] Record `hermes version`; if this is a source checkout, also record `git rev-parse --short HEAD`

        Stardust's inherited `hermes update` path is intentionally disabled while the project is on its pinned/local release policy. Do **not** update from the upstream Hermes repository as a troubleshooting step.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what's broken. Include error messages, tracebacks, or screenshots if relevant.
      placeholder: |
        What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug. The more specific, the faster it can be fixed.
      placeholder: |
        1. Start the Stardust desktop app or run `hermes chat`
        2. Perform the action "..."
        3. Agent calls tool X
        4. Error appears: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error output if available.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Stardust is affected?
      multiple: true
      options:
        - Desktop app
        - CLI (interactive chat)
        - Gateway (Telegram/Discord/Slack/WhatsApp)
        - Setup / Installation
        - Update / Recovery
        - Tools (terminal, file ops, web, code execution, etc.)
        - Skills / Plugins / MCP
        - Agent Core (conversation loop, context compression, memory)
        - Model routing / failover
        - Cron / Automations
        - Configuration (config.yaml, .env, hermes setup)
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Messaging Platform (if gateway-related)
      description: Which platform adapter is affected?
      multiple: true
      options:
        - N/A
        - Telegram
        - Discord
        - Slack
        - WhatsApp

  - type: textarea
    id: diagnostics
    attributes:
      label: Local Diagnostics
      description: |
        Prefer local diagnostics first. Run `hermes doctor`, then `hermes debug share --local` if more detail is needed.
        Review the output before attaching or pasting it. Do not include API keys, tokens, cookies, private prompts, or other secrets.

        If the desktop app offers an explicit diagnostics upload, that is a separate opt-in transport; it is not required to file a Stardust issue.
      placeholder: |
        hermes doctor:
        ...

        hermes debug share --local:
        ...
      render: shell
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Ubuntu 24.04, macOS 15.2, Windows 11
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version` when relevant
      placeholder: "3.11.9"

  - type: input
    id: hermes-version
    attributes:
      label: Stardust / Hermes Runtime Version
      description: Output of `hermes version`
      placeholder: "0.21.3"

  - type: input
    id: source-revision
    attributes:
      label: Source Revision (if running from a checkout)
      description: Output of `git rev-parse --short HEAD`
      placeholder: "abcdef1"

  - type: textarea
    id: logs
    attributes:
      label: Additional Logs / Traceback (optional)
      description: |
        Add only the extra error output needed to reproduce the failure. Review logs before posting and remove secrets or unrelated private content.
      render: shell

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause Analysis (optional)
      description: |
        If you've dug into the code and identified the root cause, share it here.
        Include file paths, line numbers, and small code snippets if useful.
      placeholder: |
        The failure appears to start in `gateway/run.py` when ...

  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed Fix (optional)
      description: If you have a fix in mind (or a PR ready), describe it here.

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - label: I'd like to fix this myself and submit a PR
