name: "🔧 Setup / Installation Help"
description: Having trouble installing or configuring Stardust? Ask here.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the details below so the failing stage can be identified without changing the installation underneath it.

        **Quick checks first:**
        - Run `hermes doctor` if the CLI is available
        - Record `hermes version`; for source installs also record `git rev-parse --short HEAD`
        - If more detail is needed, run `hermes debug share --local` and review the output before posting it
        - Check the [Stardust README](https://github.com/9529360-cpu/stardust-hermes/blob/main/README.md)

        Stardust's inherited `hermes update` path is intentionally disabled while the project uses its pinned/local release policy. Do **not** update from the upstream Hermes repository as a troubleshooting step.

  - type: textarea
    id: description
    attributes:
      label: What's Going Wrong?
      description: Describe what you're trying to do and where it fails.
      placeholder: |
        I ran the Stardust installer, reached the model/setup stage, and then...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: What did you do? Include the exact commands you ran.
      placeholder: |
        1. Ran the Stardust install command from this repository
        2. Ran `hermes setup`
        3. Selected provider/model ...
        4. Started the desktop app / `hermes chat`
        5. Error appeared: ...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - Stardust install script (curl | bash)
        - Stardust PowerShell installer (Windows)
        - Desktop bootstrap installer
        - Manual clone + pip/uv install
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version` (or `python3 --version`)
      placeholder: "3.11.9"

  - type: input
    id: hermes-version
    attributes:
      label: Stardust / Hermes Runtime Version
      description: Output of `hermes version` (if install got that far)
      placeholder: "0.21.3"

  - type: input
    id: source-revision
    attributes:
      label: Source Revision (if running from a checkout)
      description: Output of `git rev-parse --short HEAD`
      placeholder: "abcdef1"

  - type: textarea
    id: diagnostics
    attributes:
      label: Local Diagnostics
      description: |
        Paste the relevant output from `hermes doctor` and, when needed, `hermes debug share --local`.
        Review it first and remove API keys, tokens, cookies, private prompts, or unrelated personal data.
        An explicit diagnostics upload offered by the desktop app is optional and is not required for Stardust support.
      placeholder: |
        hermes doctor:
        ...

        hermes debug share --local:
        ...
      render: shell

  - type: textarea
    id: error-output
    attributes:
      label: Full Error Output
      description: Paste the complete relevant error message or traceback after removing secrets.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I've Already Tried
      description: List any fixes or workarounds you've already attempted.
      placeholder: |
        - Re-ran `hermes doctor`
        - Re-ran the Stardust installer at the same source revision
        - Verified the provider credential is configured
