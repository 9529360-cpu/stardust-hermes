name: "✨ Feature Request"
description: Suggest a Stardust feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search [existing Stardust issues](https://github.com/9529360-cpu/stardust-hermes/issues) for related work.

        Stardust is maintained as a long-term personal assistant, not as a mirror of Hermes. Proposals should explain how they improve daily assistant use, reliability, recovery, maintainability, or the desktop/workflow experience. A capability may belong in core, a plugin/MCP, or a skill depending on the cleanest ownership and failure boundary; there is no upstream-preservation requirement.

        See the repository's [Contributing Guide](https://github.com/9529360-cpu/stardust-hermes/blob/main/CONTRIBUTING.md) for implementation and review guidance.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? What are you trying to do that Stardust cannot do reliably today?
      placeholder: |
        In my daily workflow I need Stardust to ...
        Today the failure/limitation is ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Be specific about UI, runtime behavior, failure handling, configuration, or commands when relevant.
      placeholder: |
        Add a desktop flow that ...
        Or: add a config/runtime policy that ...
    validations:
      required: true

  - type: textarea
    id: failure-mode
    attributes:
      label: Failure / Recovery Expectations
      description: If this feature depends on a model, network service, plugin, background process, or stored state, what should Stardust do when that dependency fails?
      placeholder: |
        It should fail closed / retry with backoff / preserve the current session / fall back to ...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is the proposed solution better for long-term maintenance?

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - Desktop / UX
        - Agent core / model routing
        - Tool / runtime capability
        - Skill / plugin / MCP integration
        - Gateway / messaging
        - Cron / automation
        - Reliability / recovery / observability
        - Configuration
        - Installation / release / operations
        - Developer experience (tests, docs, CI)
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Expected Scope
      description: Rough estimate only; choose the closest fit.
      options:
        - Small (isolated behavior or single component)
        - Medium (several components / one subsystem)
        - Large (cross-cutting runtime or product change)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself and submit a PR

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: |
        If this request comes from a current failure, prefer `hermes doctor` and `hermes debug share --local`.
        Review diagnostic output before posting and remove secrets or unrelated private content.
      render: shell
