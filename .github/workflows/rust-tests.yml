# .github/workflows/rust-tests.yml
name: Rust tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exec-helper:
    name: stardust-exec (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build helper
        run: cargo build --release --locked -p stardust-exec
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then
            .venv/Scripts/python.exe -m pip install -e ".[dev]"
          else
            .venv/bin/python -m pip install -e ".[dev]"
          fi
      - name: Install optional native kernels
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          "$PY" -m pip install ./crates/stardust-native
      - name: Test real helper integration
        shell: bash
        run: scripts/run_tests.sh tests/tools/test_rust_exec.py tests/tools/test_native_hotspots.py

  bootstrap-installer:
    name: cargo test (bootstrap installer)
    # Standalone repository: use a standard GitHub-hosted Linux runner rather
    # than the upstream organization's private 32-core label.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/bootstrap-installer/src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Restore cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bootstrap-installer/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml') }}

      - name: cargo test
        run: cargo test --lib
