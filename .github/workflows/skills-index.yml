name: Build Stardust Skills Index

on:
  schedule:
    # Keep the runtime catalog reasonably fresh without coupling it to docs deploys.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_skills_index.py"
      - ".github/workflows/skills-index.yml"

# This workflow only runs trusted code already on main. Write permission is
# limited to publishing the generated catalog as a release asset in this repo.
permissions:
  contents: write

concurrency:
  group: stardust-skills-index
  cancel-in-progress: false

jobs:
  build-publish:
    if: github.repository == '9529360-cpu/stardust-hermes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install index dependencies
        uses: ./.github/actions/retry
        with:
          command: pip install httpx==0.28.1 pyyaml==6.0.3

      - name: Build healthy skills index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_skills_index.py

      - name: Verify generated index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("website/static/api/skills-index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          skills = data.get("skills")
          count = data.get("skill_count")
          if not isinstance(skills, list) or not skills:
              raise SystemExit("generated skills index has no skills array")
          if count != len(skills):
              raise SystemExit(f"skill_count mismatch: {count!r} != {len(skills)}")
          print(f"verified {len(skills)} skills")
          PY

      - name: Publish Stardust-owned catalog asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="stardust-skills-index"
          ASSET="website/static/api/skills-index.json"

          # A fixed prerelease tag gives installed clients one stable,
          # Stardust-owned URL without turning this generated catalog into a
          # source-controlled multi-megabyte file. A failed build never reaches
          # this step, so the previous healthy asset remains recoverable.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Stardust Skills Index"               --notes "Machine-generated Skills Hub catalog. This is a data publication channel, not a Stardust product release."               --prerelease
          fi

          gh release upload "$TAG" "$ASSET#skills-index.json"             --repo "$GITHUB_REPOSITORY"             --clobber

          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/skills-index.json"
