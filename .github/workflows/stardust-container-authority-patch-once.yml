name: Stardust container authority patch once

on:
  push:
    branches:
      - feat/stardust-release-authority
    paths:
      - .github/workflows/stardust-container-authority-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == '9529360-cpu/stardust-hermes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/stardust-release-authority
          fetch-depth: 0

      - name: Patch container and documentation authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          IMAGE = "ghcr.io/9529360-cpu/stardust-hermes"
          PULL = f"docker pull {IMAGE}:latest"

          def require_replace(path: str, old: str, new: str, *, minimum: int = 1) -> int:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} matches for {old!r}, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              return count

          require_replace(
              "Dockerfile",
              '"image": "nousresearch/hermes-agent"',
              f'"image": "{IMAGE}"',
          )

          require_replace(
              "hermes_cli/config.py",
              'docker pull nousresearch/hermes-agent:latest',
              PULL,
          )
          require_replace(
              "hermes_cli/config.py",
              'switch to ``:latest`` / ``:main`` for rolling updates.  See available\n    tags at https://hub.docker.com/r/nousresearch/hermes-agent/tags',
              'switch to ``:latest`` for the newest stable Stardust container.  See available\n    packages at https://github.com/9529360-cpu/stardust-hermes/pkgs/container/stardust-hermes',
          )

          for path in (
              "tools/browser_tool_session.py",
              "tools/browser_tool_lightpanda_fallback.py",
              "hermes_cli/tools_config_post_setup.py",
          ):
              require_replace(path, "ghcr.io/nousresearch/hermes-agent:latest", f"{IMAGE}:latest")

          require_replace("docker-compose.windows.yml", "nousresearch/hermes-agent:latest", f"{IMAGE}:latest")

          for path in (
              "website/docs/user-guide/docker.md",
              "website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/user-guide/docker.md",
          ):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text = text.replace("ghcr.io/nousresearch/hermes-agent:latest", f"{IMAGE}:latest")
              text = text.replace("nousresearch/hermes-agent:latest", f"{IMAGE}:latest")
              p.write_text(text, encoding="utf-8")

          for path in (
              "website/docs/getting-started/updating.md",
              "website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/getting-started/updating.md",
          ):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text = text.replace("docker pull nousresearch/hermes-agent:latest", PULL)
              text = text.replace("https://github.com/NousResearch/hermes-agent/releases", "https://github.com/9529360-cpu/stardust-hermes/releases")
              p.write_text(text, encoding="utf-8")

          require_replace(
              "website/docs/getting-started/updating.md",
              "The default is `true`. Explicit `hermes update --check` and `hermes update` still work; this setting does not control the Desktop application's updater.",
              "The Stardust default is `false`. Explicit `hermes update --check` and `hermes update` still work and query the Stardust repository; this setting does not control the Desktop application's updater.",
          )

          require_replace(
              "cli-config.yaml.example",
              "  # Disable passive CLI/banner update checks with `hermes config set updates.check false`.\n  # Explicit `hermes update --check` and `hermes update` remain available.\n  check: true",
              "  # Passive CLI/banner update checks are off by default in Stardust.\n  # Explicit `hermes update --check` and `hermes update` query the Stardust repository.\n  check: false",
          )

          require_replace(
              "website/docusaurus.config.ts",
              "editUrl: 'https://github.com/NousResearch/hermes-agent/edit/main/website/'",
              "editUrl: 'https://github.com/9529360-cpu/stardust-hermes/edit/main/website/'",
          )

          for path in (
              "tests/hermes_cli/test_cmd_update_docker.py",
              "tests/hermes_cli/test_update_inventory.py",
              "tests/hermes_cli/test_doctor.py",
              "tests/hermes_cli/test_web_server.py",
          ):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text = text.replace("docker pull nousresearch/hermes-agent:latest", PULL)
              p.write_text(text, encoding="utf-8")

          contract_test = Path("tests/hermes_cli/test_update_contract.py")
          text = contract_test.read_text(encoding="utf-8")
          text = text.replace('"image": "nousresearch/hermes-agent"', f'"image": "{IMAGE}"')
          text = text.replace("docker pull nousresearch/hermes-agent:latest", PULL)
          contract_test.write_text(text, encoding="utf-8")

          # Authority guard: production product-update/container surfaces must not point at
          # Nous container registries after this patch.
          forbidden_files = (
              "Dockerfile",
              "hermes_cli/config.py",
              "tools/browser_tool_session.py",
              "tools/browser_tool_lightpanda_fallback.py",
              "hermes_cli/tools_config_post_setup.py",
              "docker-compose.windows.yml",
              "website/docs/user-guide/docker.md",
              "website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/user-guide/docker.md",
              "website/docs/getting-started/updating.md",
              "website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/getting-started/updating.md",
          )
          for path in forbidden_files:
              text = Path(path).read_text(encoding="utf-8").lower()
              if "nousresearch/hermes-agent:latest" in text or "ghcr.io/nousresearch/hermes-agent" in text:
                  raise SystemExit(f"legacy container authority remains in {path}")
          PY

      - name: Validate patched sources
        shell: bash
        run: |
          python -m py_compile hermes_cli/config.py hermes_cli/tools_config_post_setup.py tools/browser_tool_session.py tools/browser_tool_lightpanda_fallback.py tests/hermes_cli/test_update_contract.py tests/hermes_cli/test_cmd_update_docker.py tests/hermes_cli/test_update_inventory.py tests/hermes_cli/test_doctor.py tests/hermes_cli/test_web_server.py
          python - <<'PY'
          from pathlib import Path
          expected = "ghcr.io/9529360-cpu/stardust-hermes"
          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")
          config = Path("hermes_cli/config.py").read_text(encoding="utf-8")
          example = Path("cli-config.yaml.example").read_text(encoding="utf-8")
          assert f'"image": "{expected}"' in dockerfile
          assert f"docker pull {expected}:latest" in config
          assert "check: false" in example
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "stardust-ci"
          git config user.email "stardust-ci@users.noreply.github.com"
          git rm .github/workflows/stardust-container-authority-patch-once.yml
          git add Dockerfile hermes_cli/config.py hermes_cli/tools_config_post_setup.py tools/browser_tool_session.py tools/browser_tool_lightpanda_fallback.py docker-compose.windows.yml cli-config.yaml.example website/docusaurus.config.ts website/docs/getting-started/updating.md website/docs/user-guide/docker.md website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/getting-started/updating.md website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/user-guide/docker.md tests/hermes_cli/test_cmd_update_docker.py tests/hermes_cli/test_update_inventory.py tests/hermes_cli/test_update_contract.py tests/hermes_cli/test_doctor.py tests/hermes_cli/test_web_server.py
          git commit -m "fix(release): align Stardust container authority"
          git push origin HEAD:feat/stardust-release-authority
