# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: JS & TS checks
    # The upstream organization used a private 32-core runner label. This
    # standalone repository intentionally targets standard GitHub-hosted
    # runners so CI works without organization-level runner registration.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          npm --version | grep -q '^12\.' || npm i -g npm@12

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      - name: Run all workspace checks
        # run-workspace-checks was introduced for a private 32-core runner,
        # where all check units could safely share one machine. On the public
        # ubuntu-latest runner, each unit (especially Vitest) creates its own
        # worker pool; running four units together oversubscribes the 4-core
        # host and has terminated the UI suite without a Vitest failure
        # summary. Serialize the outer units here so each check gets the full
        # standard runner, matching the resource isolation of the older matrix.
        run: node .github/scripts/run-workspace-checks.mjs --concurrency 1
